status = error
name = PropertiesConfig

# Root Logger
rootLogger.level = info
rootLogger.appenderRefs = file, stdout
rootLogger.appenderRef.file.ref = FILE
rootLogger.appenderRef.stdout.ref = STDOUT

# Hibernate logger khusus
logger.hibernate.name = org.hibernate
logger.hibernate.level = error
logger.hibernate.additivity = false
logger.hibernate.appenderRefs = file, stdout
logger.hibernate.appenderRef.file.ref = FILE
logger.hibernate.appenderRef.stdout.ref = STDOUT

# File Appender (Daily Rolling)
appender.file.type = RollingFile
appender.file.name = FILE
appender.file.fileName = D:/CM/log/logging_AppCM.log
appender.file.filePattern = D:/CM/log/logging_AppCM-%d{yyyy-MM-dd}.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1
appender.file.policies.time.modulate = true

# Console Appender
appender.stdout.type = Console
appender.stdout.name = STDOUT
appender.stdout.target = SYSTEM_OUT
appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
